<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List Organizer</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="app">
            <div id="header">
                <h1 id="title">To-Do List Organizer</h1>
            </div>
            <section id="checklist">
                <h2 id="checklist-title">To-Do List</h2>
                <ul id="to-do-list">
                    <!--Where checklist items will appear-->
                </ul>
                <button id="add-item-button">Add Item</button>
                <input type="text" id="new-item-input" placeholder="Enter new to-do item...">
            </section>
        </div>
        <script src="frontend.js"></script>
    </body>
</html>
